# tt-feature-discovery DaemonSet.
#
# Runs on every linux node and publishes tenstorrent.com/* labels via
# node-feature-discovery's local feature-file source. NFD must already be
# installed in the cluster (the tt-operator umbrella chart installs it).
#
# Mounts:
#   /sys/bus/pci   read-only host PCI sysfs (used to detect Tenstorrent devices)
#   /etc/kubernetes/node-feature-discovery/features.d
#                  read-write — feature files NFD-worker reads on this node
---
apiVersion: v1
kind: Namespace
metadata:
  name: tt-feature-discovery
  labels:
    app.kubernetes.io/name: tt-feature-discovery
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tt-feature-discovery
  namespace: tt-feature-discovery
  labels:
    app.kubernetes.io/name: tt-feature-discovery
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tt-feature-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tt-feature-discovery
    spec:
      # Run on every linux node — nodes without Tenstorrent devices simply
      # publish no labels, which lets NFD remove any stale label from a
      # node that lost its hardware.
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      hostPID: false
      hostNetwork: false
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      containers:
        - name: tt-feature-discovery
          image: ghcr.io/tenstorrent/tt-feature-discovery:dev
          imagePullPolicy: IfNotPresent
          args:
            - --sys-bus-pci-dir=/host-sys/bus/pci/devices
            - --feature-file=/etc/kubernetes/node-feature-discovery/features.d/tt-fd
            - --interval=60s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
              readOnly: true
            - name: nfd-features
              mountPath: /etc/kubernetes/node-feature-discovery/features.d
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: nfd-features
          hostPath:
            path: /etc/kubernetes/node-feature-discovery/features.d
            type: DirectoryOrCreate
