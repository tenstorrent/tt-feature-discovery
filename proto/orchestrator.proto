// Client-side subset of tt-fabric-manager's proto/orchestrator.proto.
//
// tt-feature-discovery only calls QueryTopologySummary, so the service here
// declares just that method. gRPC dispatch is method-name based, so this
// talks to a real fabric-manager (which implements the full service) fine.
//
// Field numbers MUST match tt-fabric-manager/proto/orchestrator.proto — they
// are the wire contract. Keep this file in sync when that one changes.
syntax = "proto3";

package fabricmanager.orchestrator;

option go_package = "github.com/tenstorrent/tt-feature-discovery/internal/fabric/orchestratorpb";

service FabricManagerService {
    // Host-level connectivity view. The fabric manager resolves the factory
    // system descriptor itself and returns per-host records, so clients never
    // have to parse an FSD.
    rpc QueryTopologySummary(QueryTopologySummaryRequest) returns (QueryTopologySummaryResponse);
}

// Which view of the system to report on: PSD is live discovered state, FSD is
// the factory "golden" state, COMBINED_PSD_FSD unions the two. Only the
// combined view carries both live ASIC counts and FSD location metadata, and
// it degrades to PSD-only when no FSD is configured.
enum TopologySource {
    PSD              = 0;
    FSD              = 1;
    COMBINED_PSD_FSD = 3;
}

message QueryTopologySummaryRequest {
    TopologySource topo_source = 1;
    bool validate_topo = 2;
}

message HostConnections {
    string hostname = 1;
    int32 connection_count = 2;
}

message HostQuirks {
    bool is_bh_glx_rev_c = 1;
}

message HostMetadata {
    string hall    = 1;
    string aisle   = 2;
    string rack    = 3;
    string shelf_u = 4;
    HostQuirks quirks = 5;
}

message HostSummary {
    string host_name = 1;
    // Field 2 is unused upstream.
    int32  asic_count = 3;
    string arch       = 4;  // e.g. "wormhole_b0"
    repeated string connected_hosts = 5;
    repeated HostConnections connection_summaries = 6;
    repeated HostConnections missing_links = 7;
    repeated HostConnections unexpected_links = 8;
    TopologySource source = 9;
    HostMetadata metadata = 10;
}

// A connected group of hosts (a connected component over cross-host links),
// optionally named after the FSD cabling hierarchy the members share.
message HostGrouping {
    repeated string host_names = 1;
    // Display name derived from the instance path common to the members, e.g.
    // "110-SC36_4x4_C1-10". Empty when no member is described by an FSD or the
    // members share no common instance path. May contain '/' separators, and a
    // " (2)" suffix when two groups derive the same name.
    string name = 2;
    // The pods this group subdivides into, named relative to the group, e.g.
    // "bh_galaxy_sp_0". A pod is the deepest instance path prefix that still
    // covers more than one host. Empty when the members are not FSD-described
    // or the hierarchy bottoms out at the group; a member in no pod appears
    // only in host_names.
    repeated HostGrouping pods = 3;
}

message QueryTopologySummaryResponse {
    repeated HostSummary hosts        = 1;
    int32 total_cross_host_links      = 2;
    repeated HostGrouping host_groups = 3;
}
